name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check
        run: node tools/build/check.mjs --tag "${{ steps.version.outputs.VERSION }}"

      - name: Zip transit folder (Chrome)
        run: zip -r "transit-chrome-${{ steps.version.outputs.VERSION }}.zip" transit/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.VERSION }}
          files: |
            transit-chrome-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
          make_latest: "legacy"
